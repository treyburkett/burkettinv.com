<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Burkett Investments — Offline</title>
  <style>
    :root {
      --bg: #0f1210;
      --fg: #e8e4dc;
      --muted: #9a958c;
      --gold: #c4a574;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #1a2218 0%, transparent 55%),
        linear-gradient(165deg, #0f1210 0%, #151a16 50%, #0c0e0c 100%);
      color: var(--fg);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    main {
      max-width: 28rem;
      text-align: center;
    }
    .brand {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--gold);
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Burkett Investments</div>
    <p>This site is temporarily offline.</p>
  </main>
</body>
</html>
