<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cyber olive mark exploration</title>
  <desc id="desc">Secondary mark exploration: angular olive tree with circuit canopy and gold fruit nodes. Not primary wordmark.</desc>
  <rect width="320" height="360" fill="#08080a"/>
  <!-- frame -->
  <rect x="18" y="18" width="284" height="324" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <path stroke="#ead4a2" stroke-width="1.5" d="M18 38h24M18 18v20M302 38h-24M302 18v20M18 322h24M18 342v-20M302 322h-24M302 342v-20"/>

  <!-- ground plane -->
  <path stroke="rgba(234,212,162,0.35)" stroke-width="1" d="M70 300h180"/>
  <path fill="#ead4a2" d="M160 300l5-4 5 4-5 4z"/>

  <!-- trunk: faceted / cyber -->
  <path fill="#cfcfd4" d="M148 168l16-8 12 12v88l-14 18h-20l-10-16V176z"/>
  <path fill="#9b9ba4" d="M148 168v94l-10-16V176z"/>
  <!-- circuit vein in trunk -->
  <path stroke="#ead4a2" stroke-width="1.5" d="M158 180v70M158 210h10M158 236h-8"/>

  <!-- canopy: geometric facets -->
  <g stroke="#f4f4f5" stroke-width="1.5" fill="rgba(244,244,245,0.04)">
    <path d="M160 48l72 44-28 52H116L88 92z"/>
    <path d="M88 92l28 52-40 28-36-40z"/>
    <path d="M204 144l40 28-36 40-28-52z"/>
    <path d="M116 144h88l-16 40H132z"/>
  </g>
  <!-- branch circuits -->
  <g stroke="#ead4a2" stroke-width="1.25" stroke-linecap="square">
    <path d="M160 70v74"/>
    <path d="M160 96l-40 28"/>
    <path d="M160 96l40 28"/>
    <path d="M120 124l-28 20"/>
    <path d="M200 124l28 20"/>
    <path d="M132 154h56"/>
  </g>
  <!-- node junctions -->
  <g fill="#ead4a2">
    <rect x="157" y="67" width="6" height="6"/>
    <rect x="157" y="93" width="6" height="6"/>
    <rect x="117" y="121" width="6" height="6"/>
    <rect x="197" y="121" width="6" height="6"/>
    <rect x="157" y="141" width="6" height="6"/>
  </g>

  <!-- olives: elongated cyber fruit -->
  <g>
    <ellipse cx="98" cy="150" rx="11" ry="16" transform="rotate(-28 98 150)" fill="#6f7a4a" stroke="#ead4a2" stroke-width="1"/>
    <ellipse cx="222" cy="148" rx="11" ry="16" transform="rotate(24 222 148)" fill="#6f7a4a" stroke="#ead4a2" stroke-width="1"/>
    <ellipse cx="140" cy="178" rx="10" ry="15" transform="rotate(-12 140 178)" fill="#55613a" stroke="#ead4a2" stroke-width="1"/>
    <ellipse cx="184" cy="176" rx="10" ry="15" transform="rotate(14 184 176)" fill="#55613a" stroke="#ead4a2" stroke-width="1"/>
    <ellipse cx="160" cy="118" rx="9" ry="13" fill="#7d8754" stroke="#ead4a2" stroke-width="1"/>
  </g>
  <!-- olive highlight chips -->
  <g fill="#ead4a2" opacity="0.85">
    <path d="M94 144l4-2 2 3-4 2z"/>
    <path d="M218 142l4-2 2 3-4 2z"/>
    <path d="M157 112l3-2 2 2-3 2z"/>
  </g>

  <!-- label -->
  <text x="160" y="328" text-anchor="middle" fill="#6a6a73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.28em">OLIVE // SECONDARY</text>
</svg>
